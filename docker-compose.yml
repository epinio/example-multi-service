services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examresults
    ports:
      - "5432:5432"
    volumes:
      - examresults-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: examresults
      REPORT_SERVICE_URL: http://report-service:4000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile.dev
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      PORT: 8080
      API_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  examresults-db-data:
